<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go América do Sul</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 14px; }
    .hud {
      width: 100%; max-width: 960px; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 12px 18px; margin-bottom: 14px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }
    .turno { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 17px; }
    .placar { display: flex; gap: 16px; font-size: 14px; color: #cbd5e1; }
    .placar strong { color: #fff; font-size: 16px; }
    button {
      background: #334155; color: #fff; border: 1px solid #475569; padding: 7px 12px;
      border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #475569; }
    button.ativo { background: #0284c7; border-color: #38bdf8; }
    .aviso { width: 100%; text-align: center; font-size: 13px; color: #fbbf24; min-height: 18px; }
    .board {
      width: 100%; max-width: 880px; aspect-ratio: 3/4; border-radius: 12px;
      overflow: hidden; border: 3px solid #334155; background: #38bdf8;
    }
    svg { width: 100%; height: 100%; display: block; cursor: crosshair; }

    /* Estilos do Mapa & Peças */
    .mar     { fill: #38bdf8; } .andes   { fill: #64748b; } .atacama { fill: #d97706; }
    .patag   { fill: #d6d3d1; } .valdiv  { fill: #065f46; } .amaz    { fill: #15803d; }
    .llanos  { fill: #fde047; } .cerrado { fill: #eab308; } .caat    { fill: #fb923c; }
    .mata    { fill: #4ade80; } .pant    { fill: #84cc16; } .pampa   { fill: #bef264; }
    .espinal { fill: #a3a380; }
    .borda-br{ stroke: #052e16; stroke-width: 0.08; fill: none; stroke-linecap: square; }
    .rio     { stroke: #0284c7; stroke-width: 0.08; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .nascente{ fill: #0369a1; stroke: #fff; stroke-width: 0.04; }
    .p1      { fill: #111827; stroke: #f8fafc; stroke-width: 0.05; }
    .p2      { fill: #f8fafc; stroke: #111827; stroke-width: 0.05; stroke-linejoin: round; }
    .ghost   { opacity: 0.45; pointer-events: none; }
    .last    { fill: #ef4444; pointer-events: none; }
  </style>
</head>
<body>

  <div class="hud">
    <div class="turno" id="turno">Carregando mapa...</div>
    <div class="placar">
      <span>● Círculos: <strong id="c1">0</strong></span>
      <span>▲ Triângulos: <strong id="c2">0</strong></span>
    </div>
    <div>
      <button id="btn-modo" class="ativo">Só Continente</button>
      <button id="btn-pass">Passar</button>
      <button id="btn-reset">Reiniciar</button>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>

  <div class="board">
    <svg id="svg" viewBox="0 0 1800 2400" xmlns="http://w3.org">
      <defs>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 0 60 H 60 V 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-opacity="0.35" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" class="mar" />
      <g transform="scale(60)" id="mapa">
        <path class="andes"   d="M5,2h3v1H5z M4,3h3v1H4z M3,4h3v3H3z M4,7h3v2H4z M5,9h3v2H5z M7,11h2v3H7z M8,14h2v11H8z M8,25h1v8H8z" />
        <path class="atacama" d="M3,7h1v2H3z M4,9h1v2H4z M5,11h2v3H5z M6,14h2v3H6z" />
        <path class="valdiv"  d="M7,20h1v13H7z" />
        <path class="patag"   d="M10,24h4v3h-1v3h-1v3h-1v2H10z M9,25h1v10H9z M9,35h4v1H9z" />
        <path class="llanos"  d="M8,2h5v1H8z M7,3h6v1H7z" />
        <path class="amaz"    d="M3,3h1v1H3z M13,3h4v1h-4z M6,4h14v1H6z M6,5h15v1H6z M6,6h17v1H6z M7,7h16v1H7z M7,8h15v1H7z M8,9h13v1H8z M6,10h13v1H6z M7,11h11v1H7z" />
        <path class="caat"    d="M23,6h2v1h-2z M23,7h4v1h-4z M23,8h5v1h-5z M23,9h4v2h-4z M23,11h3v1h-3z" />
        <path class="cerrado" d="M22,8h1v1h-1z M21,9h2v1h-2z M19,10h4v1h-4z M18,11h5v1h-5z M11,11h3v1h-3z M16,12h7v2h-7z M16,14h6v1h-6z M16,15h4v3h-4z" />
        <path class="pant"    d="M14,11h2v1h-2z M8,12h8v1H8z M7,13h9v1H7z M10,14h6v2h-6z M10,16h6v2h-6z" />
        <path class="mata"    d="M27,7h1v1h-1z M28,8h1v1h-1z M27,9h1v2h-1z M26,11h1v1h-1z M23,12h4v2h-4z M22,14h4v1h-4z M20,15h5v1h-5z M18,16h6v1h-6z M18,17h5v1h-5z M19,18h3v1h-3z" />
        <path class="pampa"   d="M14,18h5v1h-5z M14,19h7v1h-7z M14,20h6v1h-6z M14,21h5v1h-5z M14,22h5v1h-5z" />
        <path class="espinal" d="M10,18h4v5h-4z M10,23h7v1h-7z" />
        <path class="borda-br" d="M13,4h3v1h2V4h2v1h1v1h4v1h3v1h1v1h-1v2h-1v3h-1v1h-1v1h-1v1h-1v1h-1v1h-1v1h-3v1h-2v-2h-1v-1h1v-2h-1v-2h-1v-2h-1v-1h-1v-1h-2V8H9V7h2V6h2Z" />
        <g id="camada-rios"></g>
      </g>
      <rect width="100%" height="100%" fill="url(#grid)" pointer-events="none" />
      <g transform="scale(60)" id="ghost"></g>
      <g transform="scale(60)" id="pecas"></g>
    </svg>
  </div>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO DO REPOSITÓRIO GITHUB (Substitua pelo seu usuário/repositório)
    // =========================================================================
    const GITHUB_JSON_URL = "https://githubusercontent.com";
    const LOCAL_JSON_URL  = "./mapa-dados.json";

    const COLS = 30, ROWS = 40, CELL = 60;
    const svg = document.getElementById('svg');
    const elPecas = document.getElementById('pecas');
    const elGhost = document.getElementById('ghost');
    const elAviso = document.getElementById('aviso');

    let mapaData = null;
    let board = Array.from({ length: ROWS + 1 }, () => Array(COLS + 1).fill(0));
    let turn = 1, caps = { 1: 0, 2: 0 }, lastMove = null, landOnly = true;

    // 1. IMPORTAÇÃO DO JSON (Tenta o arquivo local do repo primeiro, depois o raw do GitHub)
    async function carregarMapa() {
      try {
        let res = await fetch(LOCAL_JSON_URL).catch(() => null);
        if (!res || !res.ok) res = await fetch(GITHUB_JSON_URL);
        if (!res.ok) throw new Error("Arquivo mapa-dados.json não encontrado.");
        
        mapaData = await res.json();
        desenharRios(mapaData.rios);
        aviso("Mapa importado com sucesso! Clique nos vértices para jogar.");
        render();
      } catch (err) {
        aviso("Erro ao carregar mapa-dados.json: verifique o link do GitHub no código.");
        console.error(err);
      }
    }

    // Desenha rios e nascentes dinamicamente a partir do JSON importado
    function desenharRios(rios = []) {
      const gRios = document.getElementById('camada-rios');
      gRios.innerHTML = rios.map(r => {
        const d = r.vertices.map((v, i) => `${i ? 'L' : 'M'}${v},${v}`).join(' ');
        return `<path class="rio" d="${d}" /><circle cx="${r.nascente.x}" cy="${r.nascente.y}" r="0.14" class="nascente" />`;
      }).join('');
    }

    // Verifica na matriz importada do JSON se o vértice toca o continente (terreno > 0)
    const isLand = (vx, vy) => mapaData && [,, [vx-1,vy], ].some(([x, y]) =>
      y >= 0 && y < ROWS && x >= 0 && x < COLS && mapaData.grid[y][x] > 0
    );

    const neighbors = (vx, vy) => [[vx,vy-1], [vx,vy+1], [vx-1,vy], [vx+1,vy]].filter(([x, y]) =>
      x >= 1 && x < COLS && y >= 1 && y < ROWS && (!landOnly || isLand(x, y))
    );

    // 2. MOTOR DO GO (Grupos, Liberdades, Capturas e Suicídio)
    function getGroup(sx, sy, state) {
      const color = state[sy][sx], visited = new Set([`${sx},${sy}`]), libs = new Set(), stones = [], q = [[sx, sy]];
      while (q.length) {
        const [x, y] = q.shift();
        stones.push([x, y]);
        for (const [nx, ny] of neighbors(x, y)) {
          const k = `${nx},${ny}`, v = state[ny][nx];
          if (v === 0) libs.add(k);
          else if (v === color && !visited.has(k)) { visited.add(k); q.push([nx, ny]); }
        }
      }
      return { stones, libs: libs.size };
    }

    function play(vx, vy) {
      if (!mapaData || vx < 1 || vx >= COLS || vy < 1 || vy >= ROWS) return;
      if (landOnly && !isLand(vx, vy)) return aviso("Jogue apenas nos vértices do continente.");
      if (board[vy][vx] !== 0) return aviso("Vértice já ocupado.");

      const next = board.map(r => [...r]);
      next[vy][vx] = turn;
      const opp = turn === 1 ? 2 : 1;
      let captured = 0;

      for (const [nx, ny] of neighbors(vx, vy)) {
        if (next[ny][nx] === opp) {
          const g = getGroup(nx, ny, next);
          if (g.libs === 0) { g.stones.forEach(([gx, gy]) => next[gy][gx] = 0); captured += g.stones.length; }
        }
      }

      if (getGroup(vx, vy, next).libs === 0) return aviso("Jogada inválida (Suicídio): sem liberdades.");

      board = next;
      caps[turn] += captured;
      lastMove = { x: vx, y: vy };
      turn = opp;
      aviso(captured ? `Captura! +${captured} peça(s).` : "");
      render();
    }

    // 3. RENDERIZAÇÃO OTIMIZADA VIA STRING SVG
    const shapeSVG = (x, y, player, extra = "") => player === 1
      ? `<circle cx="${x}" cy="${y}" r="0.36" class="p1 ${extra}" />`
      : `<polygon points="${x},${y-0.42} ${x-0.38},${y+0.32} ${x+0.38},${y+0.32}" class="p2 ${extra}" />`;

    function render() {
      let html = "";
      for (let y = 1; y < ROWS; y++)
        for (let x = 1; x < COLS; x++)
          if (board[y][x]) html += shapeSVG(x, y, board[y][x]);

      if (lastMove) html += `<circle cx="${lastMove.x}" cy="${lastMove.y}" r="0.09" class="last" />`;
      elPecas.innerHTML = html;

      document.getElementById('c1').textContent = caps;
      document.getElementById('c2').textContent = caps;
      document.getElementById('turno').textContent = turn === 1 ? "● Vez: Círculo (Jogador 1)" : "▲ Vez: Triângulo (Jogador 2)";
}
function getVertex(e) {
const pt = svg.createSVGPoint();
pt.x = e.clientX; pt.y = e.clientY;
const p = pt.matrixTransform(svg.getScreenCTM().inverse());
return { vx: Math.round(p.x / CELL), vy: Math.round(p.y / CELL) };
}
svg.addEventListener('mousemove', e => {
const { vx, vy } = getVertex(e);
const valid = mapaData && vx >= 1 && vx < COLS && vy >= 1 && vy < ROWS && board[vy][vx] === 0 && (!landOnly || isLand(vx, vy));
elGhost.innerHTML = valid ? shapeSVG(vx, vy, turn, "ghost") : "";
});
svg.addEventListener('mouseleave', () => elGhost.innerHTML = "");
svg.addEventListener('click', e => { const { vx, vy } = getVertex(e); play(vx, vy); });
document.getElementById('btn-modo').onclick = e => {
landOnly = !landOnly;
e.target.textContent = landOnly ? "Só Continente" : "Mapa Completo";
e.target.classList.toggle('ativo', landOnly);
};
document.getElementById('btn-pass').onclick = () => { turn = turn === 1 ? 2 : 1; render(); };
document.getElementById('btn-reset').onclick = () => {
board = Array.from({ length: ROWS + 1 }, () => Array(COLS + 1).fill(0));
caps = { 1: 0, 2: 0 }; turn = 1; lastMove = null; render();
};
const aviso = txt => elAviso.textContent = txt;
carregarMapa();
