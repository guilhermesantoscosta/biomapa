<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa da América do Sul - 150 Polígonos</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121820;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            cursor: crosshair;
            max-width: 100%;
            height: auto;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #info {
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <canvas id="mapCanvas" width="700" height="850"></canvas>
    
    <div class="controls">
        <button onclick="gerarMapa()">Gerar Novas Divisas (150 Polígonos)</button>
        <span id="info">Passe o mouse sobre uma região para destacar</span>
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const infoText = document.getElementById('info');

        // Coordenadas normalizadas (0 a 1) da silhueta da América do Sul
        const southAmericaNormalized = [
            [0.34, 0.06], [0.40, 0.05], [0.46, 0.07], [0.51, 0.10], [0.57, 0.12],
            [0.62, 0.15], [0.68, 0.19], [0.74, 0.21], [0.80, 0.23], [0.85, 0.26],
            [0.87, 0.30], [0.85, 0.35], [0.82, 0.40], [0.78, 0.44], [0.75, 0.48],
            [0.71, 0.52], [0.66, 0.55], [0.62, 0.59], [0.59, 0.63], [0.56, 0.67],
            [0.52, 0.71], [0.49, 0.76], [0.47, 0.81], [0.45, 0.86], [0.44, 0.91],
            [0.46, 0.94], [0.42, 0.95], [0.39, 0.92], [0.38, 0.86], [0.37, 0.79],
            [0.36, 0.72], [0.35, 0.65], [0.34, 0.58], [0.32, 0.52], [0.28, 0.46],
            [0.23, 0.41], [0.19, 0.36], [0.18, 0.31], [0.21, 0.26], [0.24, 0.21],
            [0.26, 0.15], [0.29, 0.10]
        ];

        let poligonos = [];
        let poligonoHover = -1;

        // Converte coordenadas normalizadas para pixels do Canvas
        function getContinentPolygon() {
            return southAmericaNormalized.map(([nx, ny]) => ({
                x: nx * canvas.width,
                y: ny * canvas.height
            }));
        }

        // Algoritmo de Sutherland-Hodgman para recortar um polígono por uma linha reta
        function clipPolygon(poly, p1, p2, keepLeft) {
            const newPoly = [];
            const isInside = (p) => {
                const cross = (p2.x - p1.x) * (p.y - p1.y) - (p2.y - p1.y) * (p.x - p1.x);
                return keepLeft ? cross >= 0 : cross <= 0;
            };

            const intersect = (a, b) => {
                const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
                const dx2 = b.x - a.x, dy2 = b.y - a.y;
                const denom = dx1 * dy2 - dy1 * dx2;
                if (Math.abs(denom) < 1e-9) return a;
                const t = ((a.x - p1.x) * dy2 - (a.y - p1.y) * dx2) / denom;
                return { x: p1.x + t * dx1, y: p1.y + t * dy1 };
            };

            for (let i = 0; i < poly.length; i++) {
                const curr = poly[i];
                const prev = poly[(i + poly.length - 1) % poly.length];
                const currIn = isInside(curr);
                const prevIn = isInside(prev);

                if (currIn) {
                    if (!prevIn) newPoly.push(intersect(prev, curr));
                    newPoly.push(curr);
                } else if (prevIn) {
                    newPoly.push(intersect(prev, curr));
                }
            }
            return newPoly;
        }

        // Calcula a área aproximada de um polígono (para dividir sempre os maiores)
        function polygonArea(poly) {
            let area = 0;
            for (let i = 0; i < poly.length; i++) {
                const j = (i + 1) % poly.length;
                area += poly[i].x * poly[j].y;
                area -= poly[j].x * poly[i].y;
            }
            return Math.abs(area) / 2;
        }

        // Subdivide o polígono base até obter exatamente N polígonos
        function subdivideToCount(basePoly, targetCount) {
            let cells = [basePoly];

            while (cells.length < targetCount) {
                // Ordena por área decrescente para manter os polígonos equilibrados
                cells.sort((a, b) => polygonArea(b) - polygonArea(a));
                const largest = cells.shift();

                // Calcula o centroide e a caixa delimitadora
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                let cx = 0, cy = 0;
                for (const p of largest) {
                    if (p.x < minX) minX = p.x;
                    if (p.x > maxX) maxX = p.x;
                    if (p.y < minY) minY = p.y;
                    if (p.y > maxY) maxY = p.y;
                    cx += p.x;
                    cy += p.y;
                }
                cx /= largest.length;
                cy /= largest.length;

                // Define um ângulo de corte perpendicular ao eixo maior + variação orgânica
                const width = maxX - minX;
                const height = maxY - minY;
                const baseAngle = width > height ? Math.PI / 2 : 0;
                const jitterAngle = (Math.random() - 0.5) * 0.7;
                const angle = baseAngle + jitterAngle;

                // Pequeno deslocamento do centro para evitar grid simétrico
                const offsetX = cx + (Math.random() - 0.5) * width * 0.2;
                const offsetY = cy + (Math.random() - 0.5) * height * 0.2;

                const p1 = { x: offsetX, y: offsetY };
                const p2 = { x: offsetX + Math.cos(angle) * 100, y: offsetY + Math.sin(angle) * 100 };

                const part1 = clipPolygon(largest, p1, p2, true);
                const part2 = clipPolygon(largest, p1, p2, false);

                if (part1.length >= 3 && part2.length >= 3) {
                    cells.push(part1, part2);
                } else {
                    // Fallback caso o corte falhe
                    cells.push(largest);
                    break;
                }
            }
            return cells;
        }

        function desenharMapa() {
            const continent = getContinentPolygon();

            // 1. Pinta todo o fundo com o OCEANO AZUL
            ctx.fillStyle = '#1b4f72';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Salva o estado do contexto antes de aplicar a máscara
            ctx.save();

            // 2. Cria o caminho do continente e aplica como MÁSCARA (clip)
            // Isso impede matematicamente qualquer traço interno de vazar para o oceano
            ctx.beginPath();
            continent.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.clip();

            // 3. Preenche a base inteira do continente de BRANCO SÓLIDO
            // Garante que antialiasing nas bordas dos 150 polígonos nunca deixe o azul aparecer
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // 4. Desenha os 150 polígonos internos
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            poligonos.forEach((poly, index) => {
                ctx.beginPath();
                poly.forEach((p, i) => {
                    if (i === 0) ctx.moveTo(p.x, p.y);
                    else ctx.lineTo(p.x, p.y);
                });
                ctx.closePath();

                // Preenchimento branco (ou destaque ao passar o mouse)
                ctx.fillStyle = (index === poligonoHover) ? '#e2e8f0' : '#ffffff';
                ctx.fill();

                // Divisa interna sutil
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            // 5. Reforça a borda interna branca na costa para selar qualquer micro-fresta de subpixel
            ctx.beginPath();
            continent.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Restaura o contexto (remove a máscara de recorte)
            ctx.restore();

            // 6. Contorno final nítido da costa sobre o oceano
            ctx.beginPath();
            continent.forEach((p, i) => {
                if (i === 0) ctx.moveTo(p.x, p.y);
                else ctx.lineTo(p.x, p.y);
            });
            ctx.closePath();
            ctx.strokeStyle = '#0f293a';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        function gerarMapa() {
            const continent = getContinentPolygon();
            poligonos = subdivideToCount(continent, 150);
            desenharMapa();
            infoText.textContent = `Mapa gerado com exatamente ${poligonos.length} polígonos.`;
        }

        // Interatividade: detecta em qual polígono o mouse está
        canvas.addEventListener('mousemove', (e) => {
Use o código com cuidado.
const rect = canvas.getBoundingClientRect();
const scaleX = canvas.width / rect.width;
const scaleY = canvas.height / rect.height;
const mouseX = (e.clientX - rect.left) * scaleX;
const mouseY = (e.clientY - rect.top) * scaleY;
let found = -1;
for (let i = 0; i < poligonos.length; i++) {
ctx.beginPath();
poligonos[i].forEach((p, idx) => {
if (idx === 0) ctx.moveTo(p.x, p.y);
else ctx.lineTo(p.x, p.y);
});
ctx.closePath();
if (ctx.isPointInPath(mouseX, mouseY)) {
found = i;
break;
}
}
if (found !== poligonoHover) {
poligonoHover = found;
desenharMapa();
infoText.textContent = found !== -1
? Região #${found + 1} de ${poligonos.length}
: Mapa gerado com exatamente ${poligonos.length} polígonos.;
}
});
// Inicializa o mapa
gerarMapa();
