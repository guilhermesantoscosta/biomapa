/**
 * PROJEÇÃO EQUIVALENTE (ÁREA REAL PRESERVADA) ROTACIONADA
 * Corrige a distorção de tamanho em altas latitudes (Canadá/Alasca não ficam gigantes)
 * usando projeção cilíndrica equivalente (sin(lat)) deitada:
 * - Eixo X: sin(lat) -> Norte à Esquerda, Sul à Direita
 * - Eixo Y: lon -> Leste no Topo, Oeste na Base
 */
function geoToCanvas(lon, lat, width, height) {
  const rad = Math.PI / 180;
  const sMax = Math.sin(72 * rad);   // Norte extremo
  const sMin = Math.sin(-56 * rad);  // Sul extremo
  const lonMax = -34;                // Leste extremo (Brasil)
  const lonMin = -168;               // Oeste extremo (Alasca)

  const padX = 28;
  const padY = 24;
  const usableW = width - padX * 2;
  const usableH = height - padY * 2;

  const sLat = Math.sin(lat * rad);
  const normX = (sMax - sLat) / (sMax - sMin);
  const normY = (lonMax - lon) / (lonMax - lonMin);

  return {
    x: padX + normX * usableW,
    y: padY + normY * usableH
  };
}

let hoveredTerritory = null;
let selectedTerritory = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}

function buildPath(territory, w, h) {
  const path = new Path2D();
  territory.coords.forEach(([lon, lat], idx) => {
    const pt = geoToCanvas(lon, lat, w, h);
    if (idx === 0) path.moveTo(pt.x, pt.y);
    else path.lineTo(pt.x, pt.y);
  });
  path.closePath();
  return path;
}

  function draw() {
const w = canvas.width;
const h = canvas.height;
// Oceano em azul
ctx.fillStyle = '#1d4ed8';
ctx.fillRect(0, 0, w, h);
ctx.lineJoin = 'round';
ctx.lineCap = 'round';
// 1ª passada: preenche todos os polígonos e sela micro-frestas de antialiasing com borda branca
territories.forEach(t => {
const path = buildPath(t, w, h);
t._path = path;
const isHovered = hoveredTerritory && hoveredTerritory.id === t.id;
const isSelected = selectedTerritory && selectedTerritory.id === t.id;
ctx.fillStyle = isSelected ? '#bfdbfe' : (isHovered ? '#e2e8f0' : '#ffffff');
ctx.fill(path);
ctx.lineWidth = 1.5;
ctx.strokeStyle = ctx.fillStyle;
ctx.stroke(path);
});
// 2ª passada: desenha o contorno nítido das divisões territoriais por cima
territories.forEach(t => {
const isHovered = hoveredTerritory && hoveredTerritory.id === t.id;
const isSelected = selectedTerritory && selectedTerritory.id === t.id;
ctx.lineWidth = isSelected ? 2.4 : (isHovered ? 1.8 : 1.0);
ctx.strokeStyle = isSelected ? '#0f172a' : '#334155';
ctx.stroke(t._path);
});
}
canvas.addEventListener('mousemove', (e) => {
const mx = e.clientX;
const my = e.clientY;
let found = null;
for (let i = territories.length - 1; i >= 0; i--) {
if (territories[i]._path && ctx.isPointInPath(territories[i]._path, mx, my)) {
found = territories[i];
break;
}
}
if (found !== hoveredTerritory) {
hoveredTerritory = found;
draw();
}
if (found) {
tooltip.style.display = 'block';
tooltip.style.left = ${mx + 12}px;
tooltip.style.top = ${my + 12}px;
tooltip.textContent = found.name;
} else {
tooltip.style.display = 'none';
}
});
canvas.addEventListener('click', () => {
if (hoveredTerritory) {
selectedTerritory = hoveredTerritory;
draw();
}
});
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
