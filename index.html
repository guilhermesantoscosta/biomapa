<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Go: Biomas da América do Sul</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #1e272e; color: #f5f6fa; font-family: sans-serif; }
    canvas { border: 3px solid #485460; background: #2980b9; cursor: pointer; }
    #hud { margin-top: 12px; display: flex; gap: 20px; align-items: center; }
    button { padding: 6px 14px; cursor: pointer; background: #dcdde1; border: none; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>
  <canvas id="board" width="800" height="600"></canvas>
  <div id="hud">
    <span id="status">Turno: Protetores</span>
    <span id="score">Capturas — Protetores: 0 | Pentágonos: 0</span>
    <button id="passBtn">Passar Turno</button>
    <button id="resetBtn">Reiniciar</button>
  </div>

  <script src="mapa.js"></script>
  <script src="jogadores.js"></script>
  <script src="mecanica.js"></script>
</body>
</html>
