<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa do Continente Americano Rotacionado (-90°)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1e6091; /* Azul do oceano */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .pais {
      fill: #ffffff;          /* Áreas continentais e ilhas em branco */
      stroke: #000000;        /* Contorno e divisas em linha preta */
      stroke-width: 0.8px;    /* Espessura da linha */
      stroke-linejoin: round; /* Suaviza os encontros das linhas */
    }

    .pais:hover {
      fill: #f0f0f0;          /* Leve destaque ao passar o mouse (opcional) */
    }
  </style>
</head>
<body>

  <svg id="mapa"></svg>

  <!-- Bibliotecas D3.js e TopoJSON via CDN -->
  <script src="https://d3js.org"></script>
  <script src="https://unpkg.com"></script>

  <script>
    const width = window.innerWidth;
    const height = window.innerHeight;

    const svg = d3.select("#mapa")
      .attr("viewBox", `0 0 ${width} ${height}`);

    // Códigos numéricos ISO 3166-1 dos países e territórios do continente americano
    const codigosAmericas = new Set([
      124, 840, 484, 304, 60, 666, // América do Norte e Groenlândia
      84, 188, 222, 320, 340, 558, 591, // América Central
      44, 52, 192, 212, 214, 308, 332, 388, 630, 659, 662, 670, 780, 796, 850, 92, 136, 531, 533, 534, 535, 312, 474, 652, 663, // Caribe
      32, 68, 76, 152, 170, 218, 238, 254, 328, 600, 604, 740, 858, 862 // América do Sul e Malvinas
    ]);

    // Carrega a malha mundial em polígonos (resolução 50m para incluir ilhas)
    d3.json("https://jsdelivr.net").then(world => {
      
      // Extrai todos os países e filtra apenas o continente americano
      const todosPaises = topojson.feature(world, world.objects.countries).features;
      const americas = {
        type: "FeatureCollection",
        features: todosPaises.filter(d => codigosAmericas.has(Number(d.id)))
      };

      // Configura a projeção Mercator com rotação de 90° anti-horário (roll = -90)
      // O array [lambda, phi, gamma] controla [longitude, latitude, rotação]
      const projection = d3.geoMercator()
        .rotate([85, 0, -90]) 
        .fitExtent([[30, 30], [width - 30, height - 30]], americas);

      const pathGenerator = d3.geoPath().projection(projection);

      // Desenha os polígonos no SVG
      svg.selectAll("path")
        .data(americas.features)
        .enter()
        .append("path")
        .attr("class", "pais")
        .attr("d", pathGenerator);
    });
  </script>
</body>
</html>
