const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

function geoToCanvas(lon, lat, width, height) {
  const rad = Math.PI / 180;
  const sMax = Math.sin(72 * rad);
  const sMin = Math.sin(-56 * rad);
  const lonMax = -34;
  const lonMin = -168;

  const padX = 24;
  const padY = 20;
  const usableW = width - padX * 2;
  const usableH = height - padY * 2;

  const sLat = Math.sin(lat * rad);
  const normX = (sMax - sLat) / (sMax - sMin);
  const normY = (lonMax - lon) / (lonMax - lonMin);

  return {
    x: padX + normX * usableW,
    y: padY + normY * usableH
  };
}

// Ilhas do Caribe (3 polígonos para fechar exatamente 100 territórios)
const islands = [
  { id: 'isl_cuba', name: 'Cuba', coords: [[-84.8,22.2], [-79.2,22.6], [-74.2,20.2], [-77.5,19.8], [-82.5,21.5]] },
  { id: 'isl_hispaniola', name: 'Haiti & Rep. Dominicana', coords: [[-74.2,19.8], [-68.4,18.6], [-71.5,17.8], [-74.4,18.4]] },
  { id: 'isl_antilhas', name: 'Jamaica, Porto Rico & Antilhas', coords: [[-78,18.2], [-66,18.4], [-61.2,14], [-61.5,11], [-63,11.5], [-67,17.5], [-77.5,17.7]] }
];

function buildTerritories() {
  const list = [];
  let count = 1;

  slices.forEach((s, sIdx) => {
    const n = s.n;
    for (let i = 0; i < n; i++) {
      const f0 = i / n;
      const f1 = (i + 1) / n;

      // Interpolação linear exata nas bordas superior e inferior da faixa
      const lonTL = s.wT + (s.eT - s.wT) * f0;
      const lonTR = s.wT + (s.eT - s.wT) * f1;
      const lonBL = s.wB + (s.eB - s.wB) * f0;
      const lonBR = s.wB + (s.eB - s.wB) * f1;

      // Para eliminar qualquer brecha entre faixas adjacentes com número diferente de colunas,
      // inserimos pontos intermediários na fronteira compartilhada com a faixa vizinha!
      const topPts = [[lonTL, s.latT]];
      if (sIdx > 0) {
        const prev = slices[sIdx - 1];
        if (Math.abs(prev.latB - s.latT) < 0.01) {
          for (let k = 1; k < prev.n; k++) {
            const pLon = prev.wB + (prev.eB - prev.wB) * (k / prev.n);
            if (pLon > lonTL && pLon < lonTR) topPts.push([pLon, s.latT]);
          }
        }
      }
      topPts.push([lonTR, s.latT]);

      const botPts = [[lonBR, s.latB]];
      if (sIdx < slices.length - 1) {
        const next = slices[sIdx + 1];
        if (Math.abs(next.latT - s.latB) < 0.01) {
          for (let k = next.n - 1; k >= 1; k--) {
            const nLon = next.wT + (next.eT - next.wT) * (k / next.n);
            if (nLon > lonBL && nLon < lonBR) botPts.push([nLon, s.latB]);
          }
        }
      }
      botPts.push([lonBL, s.latB]);

      list.push({
        id: `t_${count}`,
        name: `${count}. ${s.names[i]}`,
        coords: [...topPts, ...botPts]
      });
      count++;
    }
  });

  islands.forEach(isl => {
    list.push({
      id: isl.id,
      name: `${count}. ${isl.name}`,
      coords: isl.coords
    });
    count++;
  });

  return list;
}

const territories = buildTerritories();
let hoveredTerritory = null;
let selectedTerritory = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  draw();
}

function buildPath(territory, w, h) {
  const path = new Path2D();
  territory.coords.forEach(([lon, lat], idx) => {
    const pt = geoToCanvas(lon, lat, w, h);
    if (idx === 0) path.moveTo(pt.x, pt.y);
    else path.lineTo(pt.x, pt.y);
  });
  path.closePath();
  return path;
}

function draw() {
  const w = canvas.width;
  const h = canvas.height;

  // Oceano em azul
  ctx.fillStyle = '#1d4ed8';
  ctx.fillRect(0, 0, w, h);

  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // 1ª passada: preenchimento branco + selagem de sub-pixel com a mesma cor
  territories.forEach(t => {
    const path = buildPath(t, w, h);
    t._path = path;

    const isHovered = hoveredTerritory && hoveredTerritory.id === t.id;
    const isSelected = selectedTerritory && selectedTerritory.id === t.id;

    ctx.fillStyle = isSelected ? '#bfdbfe' : (isHovered ? '#e2e8f0' : '#ffffff');
    ctx.fill(path);

    ctx.lineWidth = 1.6;
    ctx.strokeStyle = ctx.fillStyle;
Use o código com cuidado.
ctx.stroke(path);
});
// 2ª passada: divisas nítidas entre os 100 polígonos
territories.forEach(t => {
const isHovered = hoveredTerritory && hoveredTerritory.id === t.id;
const isSelected = selectedTerritory && selectedTerritory.id === t.id;
ctx.lineWidth = isSelected ? 2.2 : (isHovered ? 1.6 : 0.9);
ctx.strokeStyle = isSelected ? '#0f172a' : '#334155';
ctx.stroke(t._path);
});
}
canvas.addEventListener('mousemove', (e) => {
const mx = e.clientX;
const my = e.clientY;
let found = null;
for (let i = territories.length - 1; i >= 0; i--) {
if (territories[i]._path && ctx.isPointInPath(territories[i]._path, mx, my)) {
found = territories[i];
break;
}
}
if (found !== hoveredTerritory) {
hoveredTerritory = found;
draw();
}
if (found) {
tooltip.style.display = 'block';
tooltip.style.left = ${mx + 12}px;
tooltip.style.top = ${my + 12}px;
tooltip.textContent = found.name;
} else {
tooltip.style.display = 'none';
}
});
canvas.addEventListener('click', () => {
if (hoveredTerritory) {
selectedTerritory = hoveredTerritory;
draw();
}
});
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
